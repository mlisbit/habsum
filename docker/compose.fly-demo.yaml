name: habsum

services:
  server:
    image: ghcr.io/mlisbit/habsum/habsum-server:latest
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
    restart: always
    environment:
      HOST: 127.0.0.1
      PORT: '3001'
      HABSUM_DB: /app/src/apps/server/config/habsum.db
      HABSUM_INITIAL_WEB_SIGNUP: 'true'
      HABSUM_ENABLE_DEMO: 'true'
      HABSUM_WEBAPP_URL: https://demo.habsum.com

  web:
    image: ghcr.io/mlisbit/habsum/habsum-webapp:latest
    restart: always
    environment:
      PORT: '3000'
      HABSUM_SERVER_URL: http://127.0.0.1:3001
    depends_on:
      - server
