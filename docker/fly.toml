app = "habsum"
primary_region = "sjc"

[build]
  image = "ghcr.io/mlisbit/habsum/habsum-server:latest"

[build.compose]
  file = "compose.fly-demo.yaml"

[env]
  HABSUM_WEBAPP_URL = "https://habsum.fly.dev"

[mounts]
  source = "habsum_data"
  destination = "/app/src/apps/server/config"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
