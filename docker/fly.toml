# fly.toml app configuration file generated for habsum on 2026-10-22T17:42:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'habsum'
primary_region = 'sjc'

[build]

[env]
  HABSUM_WEBAPP_URL = 'https://habsum.fly.dev'

[[mounts]]
  source = 'habsum_data'
  destination = '/app/src/apps/server/config'
  initial_size = '1gb'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
