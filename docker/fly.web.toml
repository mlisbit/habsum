app = "habsum-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  build-target = "webapp"

[env]
  HABSUM_SERVER_URL = "https://habsum-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
