name: habsum

services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/server', 'run', 'dev']
    environment:
      HABSUM_DEV_VERSION_OFFSET: 'true'
      HABSUM_DEBUG: 'TRACE'
      HABSUM_LOG_FORMAT: 'pretty'
      HABSUM_DB: /app/config/habsum2.db
      HABSUM_INITIAL_WEB_SIGNUP: 'true'
      HABSUM_ENABLE_DEMO: 'true'
    volumes:
      - ../src:/app/src
      # Keep Linux workspace dependencies separate from the mounted Mac source.
      - /app/src/apps/webapp/node_modules
      - /app/src/packages/stylelint/node_modules
      - ../config:/app/config
    ports:
      - '3001:3001'

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/webapp', 'run', 'dev']
    environment:
      HABSUM_SERVER_URL: http://server:3001
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ../src:/app/src
      - /app/src/apps/webapp/node_modules
      - /app/src/packages/stylelint/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - server

  homepage:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/homepage', 'run', 'dev']
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      HABSUM_DOCS_URL: http://docs:3003
    volumes:
      - ../src:/app/src
      - ../public/homepage:/app/public/homepage:ro
      - /app/src/apps/homepage/node_modules
      - /app/src/packages/stylelint/node_modules
    ports:
      - '3002:3002'
    depends_on:
      - docs

  docs:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/docs', 'run', 'dev']
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ../src:/app/src
      - ../docs:/app/docs:ro
      - /app/src/apps/docs/node_modules
      - /app/src/apps/docs/.astro
    ports:
      - '3003:3003'
