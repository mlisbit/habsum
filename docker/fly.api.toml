app = "habsum-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  build-target = "server"

[env]
  PORT = "3001"
  HABSUM_DB = "/app/src/apps/server/config/habsum.db"
  HABSUM_WEBAPP_URL = "https://habsum-web.fly.dev"

[mounts]
  source = "habsum_data"
  destination = "/app/src/apps/server/config"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
