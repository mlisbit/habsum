name: Deploy demo to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v5

      - name: Resolve latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          namespace=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "Deploying release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_prefix=ghcr.io/$namespace" >> "$GITHUB_OUTPUT"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set release images
        env:
          IMAGE_PREFIX: ${{ steps.release.outputs.image_prefix }}
          APP_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from string import Template

          compose = Path('docker/compose.fly-demo.yaml')
          compose.write_text(Template(compose.read_text()).substitute(
              IMAGE_PREFIX=os.environ['IMAGE_PREFIX'],
              APP_VERSION=os.environ['APP_VERSION'],
          ))
          PY

      - name: Deploy demo
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE_PREFIX: ${{ steps.release.outputs.image_prefix }}
          APP_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          flyctl deploy --config docker/fly.toml --ha=false \
            --image "$IMAGE_PREFIX/habsum-server:$APP_VERSION"
