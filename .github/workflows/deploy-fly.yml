name: Deploy Fly.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to deploy (leave empty to lint, test, create a patch release, and deploy; skipped when a tag is provided)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-fly
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      create_release: ${{ steps.flags.outputs.create_release }}
    steps:
      - name: Validate workflow inputs
        id: flags
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "create_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "create_release=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref_type }}" != "branch" ]]; then
            echo "Creating a new release requires running this workflow from a branch."
            exit 1
          fi

  lint:
    needs: gate
    if: needs.gate.outputs.create_release == 'true'
    uses: ./.github/workflows/lint.yml

  test:
    needs: lint
    if: needs.gate.outputs.create_release == 'true'
    uses: ./.github/workflows/test.yml

  release:
    needs: [gate, lint, test]
    if: |
      needs.gate.outputs.create_release == 'true' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success'
    uses: ./.github/workflows/release-tag.yml
    with:
      bump: patch
    permissions:
      contents: write

  resolve-version:
    needs: gate
    if: needs.gate.outputs.create_release == 'false'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        run: |
          tag="${{ inputs.version }}"

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like v0.1.2"
            exit 1
          fi
          if ! git rev-parse "$tag^{commit}" >/dev/null 2>&1; then
            echo "Tag not found: $tag"
            exit 1
          fi

          echo "Deploying tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  deploy-api:
    needs: [release, resolve-version]
    if: always() && (needs.release.result == 'success' || needs.resolve-version.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag || needs.resolve-version.outputs.tag }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API (${{ needs.release.outputs.tag || needs.resolve-version.outputs.tag }})
        run: flyctl deploy --config fly.api.toml --ha=false --remote-only

  deploy-web:
    needs: [release, resolve-version, deploy-api]
    if: always() && (needs.release.result == 'success' || needs.resolve-version.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag || needs.resolve-version.outputs.tag }}

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy web (${{ needs.release.outputs.tag || needs.resolve-version.outputs.tag }})
        run: flyctl deploy --config fly.web.toml --ha=false --remote-only
