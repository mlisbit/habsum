name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'branch'
    uses: ./.github/workflows/release-tag.yml
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write
