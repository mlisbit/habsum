name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Image tag to deploy, for example main or v0.1.2
        type: string
        required: true
        default: main

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DEPLOY_DIR: ~/docker/habsum

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate app version
        run: |
          if ! [[ "${{ inputs.app_version }}" == "main" || "${{ inputs.app_version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "app_version must be main or look like v0.1.2"
            exit 1
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Create deploy directory
        env:
          SSH_TARGET: ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            "$SSH_TARGET" \
            "mkdir -p ${{ env.DEPLOY_DIR }}"

      - name: Copy compose file
        env:
          SSH_TARGET: ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            compose.yaml \
            "$SSH_TARGET:${{ env.DEPLOY_DIR }}/compose.yml"

      - name: Log remote host in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SSH_TARGET: ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            "$SSH_TARGET" \
            "docker login ${{ env.REGISTRY }} -u '$GHCR_USER' --password-stdin"

      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            "$SSH_TARGET" "
              cd ${{ env.DEPLOY_DIR }} &&
              printf 'APP_VERSION=%s\n' '${{ inputs.app_version }}' > .env &&
              docker compose pull &&
              docker compose up -d --remove-orphans
            "
