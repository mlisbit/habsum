name: Release tag

on:
  workflow_call:
    inputs:
      bump:
        description: Version bump type
        type: string
        required: false
        default: patch
    outputs:
      tag:
        description: Created release tag
        value: ${{ jobs.release-tag.outputs.tag }}
      version:
        description: Created release version
        value: ${{ jobs.release-tag.outputs.version }}

permissions:
  contents: write

jobs:
  release-tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Bump workspace versions
        run: |
          bump="${{ inputs.bump }}"
          if [[ "$bump" != "patch" && "$bump" != "minor" ]]; then
            echo "bump must be patch or minor"
            exit 1
          fi

          new_version=$(npm version "$bump" --no-git-tag-version)

          npm version "$new_version" \
            --workspaces \
            --allow-same-version \
            --no-git-tag-version

      - name: Read release version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git add package.json package-lock.json ':(glob)src/**/package.json'
          git commit -m "Release v${{ steps.version.outputs.version }}"

      - name: Create tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"

      - name: Push release commit and tag
        run: |
          git push origin HEAD:${{ github.ref_name }} --follow-tags
