services:
  server:
    image: ghcr.io/mlisbit/habsum/habsum-server:main
    environment:
      PORT: "3001"
      HABSUM_CONFIG_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "3001"

  web:
    image: ghcr.io/mlisbit/habsum/habsum-webapp:main
    ports:
      - "8882:3000"
    depends_on:
      - server

