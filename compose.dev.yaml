services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/server', 'run', 'dev']
    environment:
      NODE_ENV: development
      HABSUM_DEV_VERSION_OFFSET: 'true'
      HABSUM_DEBUG: 'TRACE'
      HABSUM_LOG_FORMAT: 'pretty'
      HOST: 0.0.0.0
      PORT: '3001'
      HABSUM_DB: /app/config/habsum2.db
      HABSUM_INITIAL_WEB_SIGNUP: 'true'
      # Browser-facing URL for password-reset emails, account invitations, and admin-generated reset links.
      HABSUM_WEBAPP_URL: http://localhost:3000
    volumes:
      - ./src:/app/src
      # Keep Linux workspace dependencies separate from the mounted Mac source.
      - /app/src/apps/webapp/node_modules
      - /app/src/packages/stylelint/node_modules
      - ./config:/app/config
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/webapp', 'run', 'dev']
    environment:
      NODE_ENV: development
      HABSUM_SERVER_URL: http://server:3001
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./src:/app/src
      - /app/src/apps/webapp/node_modules
      - /app/src/packages/stylelint/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - server

  homepage:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: ['npm', '--workspace', 'src/apps/homepage', 'run', 'dev']
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./src:/app/src
      - ./public/homepage:/app/public/homepage:ro
      - /app/src/apps/homepage/node_modules
      - /app/src/packages/stylelint/node_modules
    ports:
      - '3002:3002'
