include_absent_days_in_average: true

habits:
  push ups:
    type: summation
    goal: 100
    summation_options: [1, 5, 10]
    history:
      period: 2w

  soda consumption:
    type: single_select
    options: [none, light, moderate, heavy]
    streak:
      options:
        - none
        - light
      show_longest: true

  pull ups:
    type: summation
    summation_options: [1, 5]
    history:
      period: 2w
